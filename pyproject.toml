[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "0.1.0"
description = "Agentic financial intelligence and investigation platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyMuPDF>=1.26,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "alembic>=1.16,<2.0",
    "python-dotenv>=1.1,<2.0",
    "sentence-transformers>=5,<6",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
[tool.setuptools.packages.find]
where = ["src"]