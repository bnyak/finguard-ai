[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "0.1.0"
description = "Agentic financial intelligence and investigation platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyMuPDF>=1.26,<2.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
[tool.setuptools.packages.find]
where = ["src"]